name: Generate Mandi Rate Images

on:
  repository_dispatch:
    types: [generate_onion_rates]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save Payload to JSON
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > payload.json

      - name: Run Image Generation Script
        run: |
          python generate_images.py payload.json

      - name: Commit and Push Generated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_images/
          git commit -m "Auto-generated daily mandi rate images [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || echo "Pull failed or skipped"
          git push
